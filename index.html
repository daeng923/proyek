<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F5F2">
<title>Galeri Proyek Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet">
<style>
/* Palet: satu aksen (biru tinta), selebihnya netral. */
:root{
  --bg:#F6F5F2; --card:#FFFFFF; --ink:#16181D; --muted:#5F646D; --line:#E3E1DB; --line2:#CFCCC3;
  --accent:#1B3A5C; --ok:#2F7D5B; --dev:#B7791F; --off:#8A8F98;
  --r:12px; --topH:60px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,.stitle,.who{font-family:'Newsreader',Georgia,'Times New Roman',serif;font-weight:600}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* bilah atas */
.top{position:sticky;top:0;z-index:40;background:rgba(246,245,242,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.top .row{display:flex;align-items:center;justify-content:space-between;height:56px;gap:12px}
.brandtxt{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icbtn{width:44px;height:44px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;flex:none}
.icbtn:hover{background:rgba(0,0,0,.05)}
.icbtn svg{width:19px;height:19px;stroke:var(--muted)}
.icbtn.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.demo{background:#EDEAE0;border-bottom:1px solid var(--line);color:var(--muted);font-size:13px;text-align:center;padding:8px 16px}
.demo code{background:rgba(0,0,0,.06);padding:1px 6px;border-radius:5px}

/* jam dan tanggal */
.clock{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 14px;margin:0 0 28px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.ctime{font-family:'Newsreader',Georgia,serif;font-size:30px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.ctime small{font-family:'Inter',system-ui,sans-serif;font-size:13px;font-weight:500;color:var(--muted);margin-left:6px}
.cdate{font-size:15px;color:var(--muted)}

/* pembuka */
.hero{padding:44px 20px 28px;max-width:1080px}
.eyebrow{font-size:14px;color:var(--muted);margin-bottom:10px}
.eyebrow:empty{display:none}
h1{margin:0 0 14px;font-size:clamp(36px,9vw,64px);line-height:1.05;letter-spacing:-.01em;max-width:16ch}
.sub{margin:0;max-width:56ch;color:var(--muted);font-size:17px}
.sub:empty{display:none}
.hookbox{margin:28px 0 0;max-width:56ch;padding-left:16px;border-left:2px solid var(--accent)}
.hooktxt{margin:0;font-family:'Newsreader',Georgia,serif;font-size:clamp(20px,4.6vw,26px);line-height:1.35;transition:opacity .4s}
.hooktxt.out{opacity:0}
.stats{display:grid;grid-template-columns:repeat(2,1fr);margin:36px 0 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stat{padding:16px 0}
.stat:nth-child(even){padding-left:16px;border-left:1px solid var(--line)}
.stat:nth-child(n+3){border-top:1px solid var(--line)}
.sn{font-family:'Newsreader',Georgia,serif;font-size:34px;line-height:1.1;font-weight:600}
.sl{font-size:13.5px;color:var(--muted)}

/* pencarian & kategori */
.bar{position:sticky;top:var(--topH);z-index:30;padding:12px 0 10px;background:rgba(246,245,242,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.search{display:block;position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--muted);pointer-events:none}
.search input{width:100%;height:48px;border-radius:10px;border:1px solid var(--line2);background:var(--card);color:var(--ink);padding:0 14px 0 42px;font:inherit;font-size:16px;outline:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(27,58,92,.12)}
.search input::placeholder{color:#8B9099}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-top:10px;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:40px;border:1px solid var(--line2);background:transparent;border-radius:99px;padding:0 14px;font-size:14px;color:var(--muted);white-space:nowrap}
.chip b{font-weight:500;margin-left:6px;opacity:.7}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}

/* kartu */
.count{margin:22px 0 14px;font-size:14px;color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr;gap:16px;padding-bottom:48px}
@media(min-width:640px){.grid{grid-template-columns:repeat(2,1fr);gap:20px}.stats{grid-template-columns:repeat(4,1fr)}.stat:nth-child(n){padding-left:20px;border-left:1px solid var(--line);border-top:0}.stat:first-child{padding-left:0;border-left:0}}
@media(min-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}.hero{padding-top:72px}}
.card{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:border-color .2s}
.card:hover{border-color:var(--line2)}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.thumb{position:relative;aspect-ratio:16/10;overflow:hidden;background:#ECEAE4}
.ph{position:absolute;inset:0;display:grid;place-items:center}
.ph span{font-family:'Newsreader',Georgia,serif;font-size:56px;font-weight:500;color:#B9B5A8}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s}
.thumb img.ok{opacity:1}
.cbody{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.clabel{font-size:13px;color:var(--muted)}
.ctitle{margin:0;font-size:22px;line-height:1.2}
.chook{margin:0;color:var(--muted);font-size:15px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.cfoot{display:flex;align-items:center;gap:12px;margin-top:auto;padding-top:10px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.ctech{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.st{display:inline-flex;align-items:center;gap:6px;color:var(--ink);white-space:nowrap}
.st i{width:7px;height:7px;border-radius:50%;background:var(--off);display:inline-block}
.st.s-aktif i{background:var(--ok)}
.st.s-pengembangan i{background:var(--dev)}
.st.s-selesai i{background:var(--accent)}

.sk{pointer-events:none}
.sk .thumb,.sk .l{background:linear-gradient(100deg,#ECEAE4 30%,#F4F2EC 50%,#ECEAE4 70%);background-size:200% 100%;animation:sh 1.4s linear infinite}
.sk .l{height:14px;border-radius:6px;margin-top:8px}
@keyframes sh{to{background-position:-200% 0}}

.empty,.err{grid-column:1/-1;text-align:center;padding:48px 20px;border:1px dashed var(--line2);border-radius:var(--r);color:var(--muted)}
.err h3{margin:0 0 8px;color:var(--ink);font-size:24px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 24px;border-radius:10px;border:0;font-weight:500;font-size:15px;color:#fff;background:var(--accent);text-decoration:none}
.btn:hover{background:#142C47}

/* detail */
.ov{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;background:rgba(20,22,28,.45);opacity:0;pointer-events:none;transition:opacity .25s}
.ov.open{opacity:1;pointer-events:auto}
.sheet{position:relative;display:flex;flex-direction:column;width:100%;max-width:720px;max-height:92vh;max-height:92dvh;background:var(--card);border-radius:18px 18px 0 0;overflow:hidden;outline:none;transform:translateY(24px);transition:transform .28s ease-out}
.ov.open .sheet{transform:none}
@media(min-width:720px){.ov{align-items:center}.sheet{border-radius:18px;max-height:88vh}}
.sscroll{overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.smedia{position:relative;aspect-ratio:16/9;background:#ECEAE4;overflow:hidden}
.smedia img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s}
.smedia img.ok{opacity:1}
.close{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:10px;z-index:5;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.92);box-shadow:0 1px 3px rgba(0,0,0,.15);display:grid;place-items:center}
.close svg{width:18px;height:18px;stroke:var(--ink)}
.sbody{padding:22px 22px 26px}
.stitle{margin:4px 0 8px;font-size:clamp(28px,6.5vw,38px);line-height:1.1}
.shook{margin:0 0 14px;font-size:19px;line-height:1.4;color:var(--accent);font-family:'Newsreader',Georgia,serif}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-bottom:16px;font-size:14px;color:var(--muted)}
.sdesc{margin:0 0 8px;color:#2B2F36;font-size:16px;max-width:62ch}
.sh{margin:24px 0 8px;font-size:15px;font-weight:600}
.facts{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.facts li{padding:11px 0;border-bottom:1px solid var(--line);font-size:15.5px}
.techs{margin:0;color:var(--muted);font-size:15px}
.snav{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--card)}
.nbtn{min-height:44px;padding:0 14px;border-radius:10px;border:0;background:transparent;font-size:15px;color:var(--accent);font-weight:500}
.nbtn:hover{background:rgba(27,58,92,.07)}
.snav .pos{font-size:14px;color:var(--muted)}
.cta{margin-top:24px}

.foot{padding:36px 20px calc(48px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);color:var(--muted);font-size:14px}
.foot .who{font-size:24px;color:var(--ink);line-height:1.2;margin-bottom:4px}
.foot .upd{margin-top:12px;font-size:13px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);z-index:80;max-width:88vw;padding:12px 18px;border-radius:10px;background:var(--ink);color:#fff;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
</style>
</head>
<body>

<header class="top" id="top">
  <div class="wrap row">
    <span class="brandtxt" id="brandTxt">Galeri Proyek</span>
    <div class="icbtn" id="btnRefresh" role="button" tabindex="0" aria-label="Muat ulang data">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>
    </div>
  </div>
</header>
<div class="demo" id="demoBar" hidden>Mode demo. Isi <code>GAS_URL</code> di index.html agar data dibaca dari spreadsheet.</div>

<main>
  <section class="wrap hero">
    <div class="clock" id="clock"><span class="ctime" id="clockTime"></span><span class="cdate" id="clockDate"></span></div>
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="title">Galeri Proyek Digital</h1>
    <p class="sub" id="subtitle"></p>
    <div class="hookbox" id="hookBox" hidden><p class="hooktxt" id="hookTxt"></p></div>
    <div class="stats" id="stats"></div>
  </section>

  <section class="bar" id="bar">
    <div class="wrap">
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Cari proyek atau kata kunci" autocomplete="off" enterkeyhint="search" aria-label="Cari proyek">
      </label>
      <div class="chips" id="chips"></div>
    </div>
  </section>

  <section class="wrap">
    <div class="count" id="count"></div>
    <div class="grid" id="grid"></div>
  </section>
</main>

<footer class="wrap foot" id="foot"></footer>

<div class="ov" id="ov" aria-hidden="true">
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Detail proyek" tabindex="-1"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  /* ============ PENGATURAN ============ */
  // URL Web App GAS (berakhiran /exec).
  const GAS_URL = 'https://script.google.com/macros/s/AKfycby1Q2INjvxmTjopUQhRGwAFrGczZvdrzB4cs5cfujH7OPEAztbUw8c9KEOeC0mACsY/exec';
  const CACHE_KEY = 'galeri_proyek_v1';
  const CACHE_TTL = 5 * 60 * 1000;
  const FETCH_TIMEOUT = 20000;
  const VID_KEY = 'galeri_vid';
  /* ===================================== */

  const DEMO = {
    status: 'ok',
    config: {
      judul: 'Galeri Proyek Digital',
      eyebrow: 'Bimbingan Teknis - Transformasi Digital',
      subjudul: 'Contoh tampilan. Data asli dibaca dari spreadsheet setelah GAS_URL diisi.',
      hook_1: 'Semua ini dibuat oleh satu orang yang mengaku bukan programmer.',
      hook_2: 'Tanpa server berbayar. Cukup spreadsheet yang kita pakai setiap hari.',
      penyusun: 'Nama Penyusun', jabatan: 'Jabatan', instansi: 'Instansi', footer: 'Catatan kaki.'
    },
    items: [
      { id: 1, kategori: 'Kegiatan & Event', nama: 'Sertifikat Peserta', hook: 'Sertifikat ribuan peserta tanpa mengetik satu nama pun', deskripsi: 'Peserta masuk dengan akun Google, sistem mengenali peran dan menerbitkan PDF bertanda QR.', fakta: ['1.700 peserta', 'PDF otomatis', 'QR verifikasi'], teknologi: ['Google Apps Script', 'Google Sheets'], status: 'Aktif', tahun: '2026', gambar: '', tautan: '' },
      { id: 2, kategori: 'Akademik & Penjadwalan', nama: 'Jadwal Ujian', hook: 'Ganti UTS ke UAS cukup edit satu sel', deskripsi: 'Tabel jadwal ujian yang selalu mengikuti spreadsheet.', fakta: ['Filter dan unduh PDF', 'Cache 5 menit'], teknologi: ['GAS', 'Tailwind CSS'], status: 'Aktif', tahun: '2026', gambar: '', tautan: '' },
      { id: 3, kategori: 'Administrasi & Layanan', nama: 'Klaim Lembur', hook: '4 tahap persetujuan tanpa map berkas', deskripsi: 'Alur klaim dari karyawan sampai pembayaran.', fakta: ['4 peran', 'Notifikasi email'], teknologi: ['GAS', 'Google Sheets'], status: 'Pengembangan', tahun: '2026', gambar: '', tautan: '' }
    ],
    updated: 'contoh'
  };

  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  const $ = function (s) { return document.querySelector(s); };
  const el = {
    top: $('#top'), brand: $('#brandTxt'), refresh: $('#btnRefresh'), demo: $('#demoBar'),
    eyebrow: $('#eyebrow'), title: $('#title'), sub: $('#subtitle'),
    hookBox: $('#hookBox'), hookTxt: $('#hookTxt'),
    stats: $('#stats'), q: $('#q'), chips: $('#chips'), count: $('#count'), grid: $('#grid'),
    foot: $('#foot'), ov: $('#ov'), sheet: $('#sheet'), toast: $('#toast')
  };

  const state = { cfg: {}, items: [], cats: [], cat: 'Semua', q: '', view: [], cur: -1, updated: '', demo: false, visits: null };
  let hookTimer = null, io = null, lastFocus = null, toastTimer = null, tracked = false;

  /* ---------- util ---------- */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function safeUrl(u) {
    // Hanya alamat lengkap http(s). Kosong, "#", "-", atau teks lain dianggap tidak ada tautan.
    var v = String(u == null ? '' : u).trim();
    if (!/^https?:\/\//i.test(v)) return '';
    try {
      var x = new URL(v);
      return (x.protocol === 'https:' || x.protocol === 'http:') ? x.href : '';
    } catch (e) { return ''; }
  }
  function pad(n) { return String(n).padStart(2, '0'); }
  function isPlaceholder() { return !/^https:\/\/script\.google\.com\//.test(GAS_URL); }
  function toast(msg) {
    el.toast.textContent = msg;
    el.toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.toast.classList.remove('show'); }, 3200);
  }
  function statusClass(s) { return 's-' + String(s || '').toLowerCase().replace(/[^a-z]/g, ''); }

  /* ---------- cache ---------- */
  function readCache(requireFresh) {
    try {
      var raw = localStorage.getItem(CACHE_KEY);
      if (!raw) return null;
      var o = JSON.parse(raw);
      if (!o || !o.data) return null;
      if (requireFresh && Date.now() - o.t > CACHE_TTL) return null;
      return o.data;
    } catch (e) { return null; }
  }
  function writeCache(data) {
    try { localStorage.setItem(CACHE_KEY, JSON.stringify({ t: Date.now(), data: data })); } catch (e) {}
  }

  /* ---------- ambil data ---------- */
  async function fetchData(force) {
    var ctl = new AbortController();
    var timer = setTimeout(function () { ctl.abort(); }, FETCH_TIMEOUT);
    try {
      var url = GAS_URL + (GAS_URL.indexOf('?') > -1 ? '&' : '?') + 'action=data' + (force ? '&refresh=1&t=' + Date.now() : '');
      var res = await fetch(url, { redirect: 'follow', signal: ctl.signal });
      var text = await res.text();
      var json;
      try { json = JSON.parse(text); }
      catch (e) { throw new Error('Respons bukan JSON. Periksa deployment GAS: jalankan sebagai Saya, akses Siapa saja.'); }
      if (json.status !== 'ok') throw new Error(json.message || 'Gagal memuat data.');
      return json;
    } catch (e) {
      if (e && e.name === 'AbortError') throw new Error('Waktu tunggu habis. Coba muat ulang.');
      throw e;
    } finally { clearTimeout(timer); }
  }

  async function load(force) {
    showSkeleton();
    var data = null;
    if (!force) data = readCache(true);

    if (!data) {
      if (isPlaceholder()) {
        state.demo = true;
        data = DEMO;
      } else {
        try {
          data = await fetchData(force);
          writeCache(data);
        } catch (err) {
          var stale = readCache(false);
          if (stale) { data = stale; toast('Tidak terhubung. Menampilkan data tersimpan.'); }
          else { showError(err); return; }
        }
      }
    }
    el.demo.hidden = !state.demo;
    apply(data);
    if (force) toast('Data diperbarui');
    if (!state.demo && !tracked) { tracked = true; trackVisit(); }
  }

  /* ---------- hitung pengunjung ---------- */
  function visitorId() {
    var id = '', isNew = false;
    try { id = localStorage.getItem(VID_KEY) || ''; } catch (e) {}
    if (!/^[A-Za-z][A-Za-z0-9]{7,39}$/.test(id)) {
      var a = new Uint8Array(12);
      if (window.crypto && crypto.getRandomValues) crypto.getRandomValues(a);
      else for (var i = 0; i < a.length; i++) a[i] = Math.floor(Math.random() * 256);
      id = 'v' + Array.prototype.map.call(a, function (b) { return (b % 36).toString(36); }).join('');
      try { localStorage.setItem(VID_KEY, id); isNew = true; } catch (e) { isNew = false; }
    }
    return { id: id, isNew: isNew };
  }

  async function trackVisit() {
    try {
      var v = visitorId();
      var src = '';
      try { src = document.referrer ? new URL(document.referrer).hostname : ''; } catch (e) {}
      if (src === location.hostname) src = '';
      var url = GAS_URL + (GAS_URL.indexOf('?') > -1 ? '&' : '?') + 'action=hit' +
        '&vid=' + encodeURIComponent(v.id) +
        '&baru=' + (v.isNew ? '1' : '0') +
        '&dev=' + (window.innerWidth < 768 ? 'hp' : 'pc') +
        '&src=' + encodeURIComponent(src);
      var res = await fetch(url, { redirect: 'follow' });
      var j = JSON.parse(await res.text());
      if (j && j.status === 'ok' && j.tampil) {
        state.visits = { total: +j.total || 0, unik: +j.unik || 0 };
        renderFoot();
      }
    } catch (e) { /* pencatatan gagal tidak boleh mengganggu halaman */ }
  }

  /* ---------- tampilan ---------- */
  function showSkeleton() {
    var h = '';
    for (var i = 0; i < 6; i++) {
      h += '<div class="card sk"><div class="thumb"></div><div class="cbody"><div class="l" style="width:40%"></div><div class="l" style="width:75%;height:22px"></div><div class="l" style="width:90%"></div></div></div>';
    }
    el.grid.innerHTML = h;
    el.count.textContent = 'Memuat';
  }

  function showError(err) {
    el.count.textContent = '';
    el.grid.innerHTML = '<div class="err"><h3>Data belum dapat dimuat</h3><p>' + esc(err && err.message ? err.message : 'Terjadi kesalahan.') + '</p><button class="btn" type="button" data-act="retry">Coba lagi</button></div>';
  }

  function apply(data) {
    var cfg = data.config || {};
    var items = (data.items || []).slice();
    var cats = [];
    items.forEach(function (it, i) {
      it.kategori = it.kategori || 'Lainnya';
      if (cats.indexOf(it.kategori) < 0) cats.push(it.kategori);
      it._n = i + 1;
      it.fakta = Array.isArray(it.fakta) ? it.fakta : [];
      it.teknologi = Array.isArray(it.teknologi) ? it.teknologi : [];
    });
    items.forEach(function (it) { it._c = cats.indexOf(it.kategori); });

    state.cfg = cfg; state.items = items; state.cats = cats; state.updated = data.updated || '';
    if (state.cat !== 'Semua' && cats.indexOf(state.cat) < 0) state.cat = 'Semua';

    var judul = cfg.judul || 'Galeri Proyek Digital';
    document.title = judul;
    el.brand.textContent = judul;
    el.title.textContent = judul;
    el.eyebrow.textContent = cfg.eyebrow || '';
    el.sub.textContent = cfg.subjudul || '';

    startHooks([cfg.hook_1, cfg.hook_2, cfg.hook_3].filter(function (h) { return h && String(h).trim(); }));
    renderStats();
    renderChips();
    renderGrid();
    renderFoot();
  }

  function renderStats() {
    var tech = {};
    state.items.forEach(function (it) { it.teknologi.forEach(function (t) { tech[t.toLowerCase()] = 1; }); });
    var aktif = state.items.filter(function (it) { return /aktif/i.test(it.status); }).length;
    var data = [
      [state.items.length, 'Proyek'],
      [state.cats.length, 'Kategori'],
      [aktif, 'Sudah dipakai'],
      [Object.keys(tech).length, 'Teknologi']
    ];
    el.stats.innerHTML = data.map(function (d) {
      return '<div class="stat"><div class="sn" data-to="' + d[0] + '">' + d[0] + '</div><div class="sl">' + esc(d[1]) + '</div></div>';
    }).join('');
  }

  function startHooks(arr) {
    clearInterval(hookTimer);
    if (!arr.length) { el.hookBox.hidden = true; return; }
    el.hookBox.hidden = false;
    var i = 0;
    el.hookTxt.textContent = arr[0];
    el.hookTxt.classList.remove('out');
    if (arr.length < 2 || reduce) return;
    hookTimer = setInterval(function () {
      el.hookTxt.classList.add('out');
      setTimeout(function () {
        i = (i + 1) % arr.length;
        el.hookTxt.textContent = arr[i];
        el.hookTxt.classList.remove('out');
      }, 400);
    }, 7000);
  }

  function renderChips() {
    var counts = {};
    state.items.forEach(function (it) { counts[it.kategori] = (counts[it.kategori] || 0) + 1; });
    var list = [['Semua', state.items.length]].concat(state.cats.map(function (c) { return [c, counts[c]]; }));
    el.chips.innerHTML = list.map(function (c) {
      return '<button class="chip' + (c[0] === state.cat ? ' on' : '') + '" type="button" data-cat="' + esc(c[0]) + '">' + esc(c[0]) + '<b>' + c[1] + '</b></button>';
    }).join('');
    var on = el.chips.querySelector('.chip.on');
    if (on && on.scrollIntoView) { try { on.scrollIntoView({ block: 'nearest', inline: 'center' }); } catch (e) {} }
  }

  function filtered() {
    var q = state.q.trim().toLowerCase();
    return state.items.filter(function (it) {
      if (state.cat !== 'Semua' && it.kategori !== state.cat) return false;
      if (!q) return true;
      var hay = [it.nama, it.hook, it.deskripsi, it.kategori, it.teknologi.join(' '), it.fakta.join(' ')].join(' ').toLowerCase();
      return hay.indexOf(q) > -1;
    });
  }

  function placeholder(it) {
    var ch = String(it.nama || '?').trim().charAt(0).toUpperCase();
    return '<div class="ph" aria-hidden="true"><span>' + esc(ch) + '</span></div>';
  }

  function imgTag(it) {
    var u = safeUrl(it.gambar);
    return u ? '<img src="' + esc(u) + '" alt="' + esc('Pratinjau ' + it.nama) + '" loading="lazy" decoding="async" referrerpolicy="no-referrer">' : '';
  }

  function bindImages(root) {
    root.querySelectorAll('img').forEach(function (im) {
      if (im.complete && im.naturalWidth) { im.classList.add('ok'); return; }
      im.addEventListener('load', function () { im.classList.add('ok'); });
      im.addEventListener('error', function () { im.remove(); });
    });
  }

  function stHTML(s) {
    return s ? '<span class="st ' + statusClass(s) + '"><i></i>' + esc(s) + '</span>' : '';
  }

  function cardHTML(it, i) {
    var tech = it.teknologi.slice(0, 3).map(esc).join(', ');
    return '<article class="card" tabindex="0" role="button" data-i="' + i + '" aria-label="' + esc('Buka detail ' + it.nama) + '">' +
      '<div class="thumb">' + placeholder(it) + imgTag(it) + '</div>' +
      '<div class="cbody">' +
        '<div class="clabel">' + esc(it.kategori) + '</div>' +
        '<h3 class="ctitle">' + esc(it.nama) + '</h3>' +
        (it.hook ? '<p class="chook">' + esc(it.hook) + '</p>' : '') +
        '<div class="cfoot">' + stHTML(it.status) + (tech ? '<span class="ctech">' + tech + '</span>' : '') + '</div>' +
      '</div></article>';
  }

  function renderGrid() {
    state.view = filtered();
    el.count.textContent = state.view.length + ' proyek' + (state.cat !== 'Semua' ? ' · ' + state.cat : '') + (state.q.trim() ? ' · "' + state.q.trim() + '"' : '');
    if (!state.view.length) {
      el.grid.innerHTML = '<div class="empty">Tidak ada proyek yang cocok. Coba kata kunci atau kategori lain.</div>';
      return;
    }
    el.grid.innerHTML = state.view.map(cardHTML).join('');
    bindImages(el.grid);
    observeCards();
  }

  function observeCards() {}

  function renderFoot() {
    var c = state.cfg;
    var parts = [];
    if (c.penyusun) parts.push('<div class="who">' + esc(c.penyusun) + '</div>');
    var line = [c.jabatan, c.instansi].filter(Boolean).map(esc).join(' · ');
    if (line) parts.push('<div>' + line + '</div>');
    if (c.footer) parts.push('<div style="margin-top:6px">' + esc(c.footer) + '</div>');
    if (state.visits) {
      var nf = function (n) { try { return n.toLocaleString('id-ID'); } catch (e) { return String(n); } };
      parts.push('<div class="upd" id="visits">Dibuka ' + nf(state.visits.total) + ' kali oleh ' + nf(state.visits.unik) + ' pengunjung</div>');
    }
    if (state.updated) parts.push('<div class="upd">Data diperbarui ' + esc(state.updated) + '</div>');
    el.foot.innerHTML = parts.join('');
  }

  /* ---------- detail ---------- */
  function sheetHTML(it, pos, total) {
    var u = safeUrl(it.gambar);
    var link = safeUrl(it.tautan);
    var facts = it.fakta.map(function (f) { return '<li>' + esc(f) + '</li>'; }).join('');
    var tech = it.teknologi.map(esc).join(', ');
    return '<button class="close" type="button" data-act="close" aria-label="Tutup"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>' +
      '<div class="sscroll" id="sscroll">' +
        '<div class="smedia">' + placeholder(it) + (u ? imgTag(it) : '') + '</div>' +
        '<div class="sbody">' +
          '<div class="clabel">' + esc(it.kategori) + '</div>' +
          '<h2 class="stitle">' + esc(it.nama) + '</h2>' +
          (it.hook ? '<p class="shook">' + esc(it.hook) + '</p>' : '') +
          '<div class="meta">' + stHTML(it.status) + (it.tahun ? '<span class="yr">' + esc(it.tahun) + '</span>' : '') + '</div>' +
          (it.deskripsi ? '<p class="sdesc">' + esc(it.deskripsi) + '</p>' : '') +
          (facts ? '<h4 class="sh">Sorotan</h4><ul class="facts">' + facts + '</ul>' : '') +
          (tech ? '<h4 class="sh">Teknologi</h4><p class="techs">' + tech + '</p>' : '') +
          (link ? '<div class="cta"><a class="btn" href="' + esc(link) + '" target="_blank" rel="noopener noreferrer">Buka proyek</a></div>' : '') +
        '</div>' +
      '</div>' +
      '<div class="snav"><button class="nbtn" type="button" data-act="prev">Sebelumnya</button><span class="pos">' + pos + ' / ' + total + '</span><button class="nbtn" type="button" data-act="next">Berikutnya</button></div>';
  }

  function renderSheet() {
    var it = state.view[state.cur];
    if (!it) return;
    el.sheet.innerHTML = sheetHTML(it, state.cur + 1, state.view.length);
    bindImages(el.sheet);
  }

  function openSheet(i) {
    if (i < 0 || i >= state.view.length) return;
    lastFocus = document.activeElement;
    state.cur = i;
    renderSheet();
    el.ov.classList.add('open');
    el.ov.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
    setTimeout(function () { el.sheet.focus({ preventScroll: true }); }, 50);
  }

  function closeSheet() {
    if (!el.ov.classList.contains('open')) return;
    el.ov.classList.remove('open');
    el.ov.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    if (lastFocus && lastFocus.focus) { try { lastFocus.focus({ preventScroll: true }); } catch (e) {} }
  }

  function step(dir) {
    var n = state.view.length;
    if (n < 2) return;
    state.cur = (state.cur + dir + n) % n;
    renderSheet();
    var sc = $('#sscroll');
    if (sc) sc.scrollTop = 0;
  }

  /* ---------- event ---------- */
  el.grid.addEventListener('click', function (e) {
    var r = e.target.closest('[data-act="retry"]');
    if (r) { load(true); return; }
    var c = e.target.closest('.card[data-i]');
    if (c) openSheet(+c.getAttribute('data-i'));
  });
  el.grid.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    var c = e.target.closest('.card[data-i]');
    if (c) { e.preventDefault(); openSheet(+c.getAttribute('data-i')); }
  });

  el.chips.addEventListener('click', function (e) {
    var b = e.target.closest('[data-cat]');
    if (!b) return;
    state.cat = b.getAttribute('data-cat');
    renderChips();
    renderGrid();
  });

  var qTimer = null;
  el.q.addEventListener('input', function () {
    clearTimeout(qTimer);
    qTimer = setTimeout(function () { state.q = el.q.value; renderGrid(); }, 140);
  });

  el.refresh.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); el.refresh.click(); }
  });
  el.refresh.addEventListener('click', async function () {
    if (el.refresh.classList.contains('spin')) return;
    el.refresh.classList.add('spin');
    try { await load(true); } finally { el.refresh.classList.remove('spin'); }
  });

  el.ov.addEventListener('click', function (e) {
    if (e.target === el.ov) { closeSheet(); return; }
    var b = e.target.closest('[data-act]');
    if (!b) return;
    var a = b.getAttribute('data-act');
    if (a === 'close') closeSheet();
    else if (a === 'prev') step(-1);
    else if (a === 'next') step(1);
  });

  document.addEventListener('keydown', function (e) {
    if (!el.ov.classList.contains('open')) return;
    if (e.key === 'Escape') closeSheet();
    else if (e.key === 'ArrowLeft') step(-1);
    else if (e.key === 'ArrowRight') step(1);
  });

  var tx = 0, ty = 0;
  el.sheet.addEventListener('touchstart', function (e) {
    var t = e.changedTouches[0]; tx = t.clientX; ty = t.clientY;
  }, { passive: true });
  el.sheet.addEventListener('touchend', function (e) {
    var t = e.changedTouches[0], dx = t.clientX - tx, dy = t.clientY - ty;
    if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.6) step(dx < 0 ? 1 : -1);
  }, { passive: true });

  /* ---------- jam dan tanggal (WIB) ---------- */
  function startClock() {
    var tEl = $('#clockTime'), dEl = $('#clockDate');
    if (!tEl || !dEl) return;
    var tf, df;
    try {
      tf = new Intl.DateTimeFormat('id-ID', { timeZone: 'Asia/Jakarta', hour: '2-digit', minute: '2-digit', hour12: false });
      df = new Intl.DateTimeFormat('id-ID', { timeZone: 'Asia/Jakarta', weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    } catch (e) { $('#clock').hidden = true; return; }
    function tick() {
      var now = new Date();
      tEl.innerHTML = esc(tf.format(now).replace(':', '.')) + '<small>WIB</small>';
      dEl.textContent = df.format(now);
      setTimeout(tick, 60000 - (now.getSeconds() * 1000 + now.getMilliseconds()) + 50);
    }
    tick();
  }

  function setTopH() {
    document.documentElement.style.setProperty('--topH', el.top.offsetHeight + 'px');
  }
  window.addEventListener('resize', setTopH);
  window.addEventListener('load', setTopH);
  setTopH();

  startClock();
  load(false);
})();
</script>
</body>
</html>
